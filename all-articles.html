<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Articles</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      margin: 0 0 20px 0;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }
    .article {
      border-bottom: 1px solid #eee;
      padding: 18px 0;
    }
    .article h2 {
      margin: 0 0 6px 0;
      font-size: 1.4em;
    }
    .meta {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    .article h2 a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .article h2 a:hover {
      color: #B5281A;
    }
    .tag-pills {
      margin: 6px 0 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-pill {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid #B5281A;
      color: #B5281A;
      border-radius: 9999px;
      font-size: 0.85em;
      text-decoration: none;
      line-height: 1.2;
    }
    .tag-pill:hover {
      background: #B5281A;
      color: #fff;
    }
    .excerpt { word-break: break-word; }
  </style>
</head>
<body>
  <h1>All Articles</h1>
  <div id="allArticles"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="article-rendering.js"></script>

  <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const listEl = document.getElementById('allArticles');

  const PAGE_SIZE = 10;
  let offset = 0;
  let loading = false;
  const loadMoreBtn = document.createElement('button');
  loadMoreBtn.textContent = 'Load more';
  loadMoreBtn.className = 'btn-pill';
  loadMoreBtn.style.margin = '16px auto';
  loadMoreBtn.style.display = 'none';

  listEl.insertAdjacentElement('afterend', loadMoreBtn);

  async function fetchPage() {
    if (loading) return;
    loading = true;
    loadMoreBtn.disabled = true;

    const { data: rows, error } = await supabase
      .from('articles')
      .select('id,title,author,author_slug,image,body,tags,timestamp,editors_pick')
      .order('timestamp', { ascending: false })
      .range(offset, offset + PAGE_SIZE - 1);

    if (error) {
      console.error('Error loading articles:', error);
      if (offset === 0) listEl.innerHTML = '<p>Could not load articles.</p>';
      loadMoreBtn.style.display = 'none';
      loading = false;
      return;
    }

    if (offset === 0 && (!rows || rows.length === 0)) {
      listEl.innerHTML = '<p>No articles yet.</p>';
      loadMoreBtn.style.display = 'none';
      loading = false;
      return;
    }

    (rows || []).forEach((article) => {
      listEl.appendChild(ArticleTools.createArticleListItem(article));
    });

    const received = rows ? rows.length : 0;
    offset += received;

    if (received < PAGE_SIZE) {
      loadMoreBtn.style.display = 'none';
    } else {
      loadMoreBtn.style.display = 'block';
      loadMoreBtn.disabled = false;
    }

    loading = false;
  }

  loadMoreBtn.addEventListener('click', fetchPage);
  await fetchPage();
})();
</script>
</body>
</html>
