 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .article-title {
      font-size: 2em;
      margin-bottom: 10px;
    }
    .author {
      font-style: italic;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .date {
      color: #666;
      font-size: 0.85em;
      margin-bottom: 20px;
    }
    .article-body {
      line-height: 1.6;
    }
    img {
      max-width: 100%;
      margin: 20px 0;
    }
    .tag-pills {
  margin: 8px 0 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-pill {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid #B5281A;   /* Colorado red */
  color: #B5281A;               /* Colorado red */
  border-radius: 9999px;        /* fully rounded pill */
  font-size: 0.85em;
  text-decoration: none;
  line-height: 1.2;
}
.tag-pill:hover {
  background: #B5281A;
  color: #fff;
}
.author-card {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;        /* center under the All Articles button */
  margin: 6px 0 40px;
}
.author-card img {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #ddd;
}
.author-card .name {
  font-weight: bold;
}
.author-card a {
  color: inherit;
  text-decoration: none;
}
.author-card a:hover {
  color: #B5281A;
}
  </style>
</head>
<body>
  <div id="articleContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="article-rendering.js"></script>

  <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const params = new URLSearchParams(window.location.search);
  const idParam = params.get('id');
  const id = Number(idParam);
  const container = document.getElementById('articleContainer');

  if (!idParam || Number.isNaN(id)) {
    container.innerHTML = '<p>Invalid article link.</p>';
    return;
  }

  const { data: article, error } = await supabase
    .from('articles')
    .select('*')
    .eq('id', id)
    .single();

  if (error || !article) {
    container.innerHTML = '<p>Article not found.</p>';
    console.error(error);
    return;
  }

  try {
    await supabase.rpc('increment_article_view', { p_id: id });
    const { data: updated, error: viewErr } = await supabase
      .from('articles')
      .select('views')
      .eq('id', id)
      .single();
    if (!viewErr && updated) article.views = updated.views;
  } catch (e) {
    console.warn('View increment failed:', e);
  }

  const tagsHtml = ArticleTools.makeTagPillsHtml(article);
  const dateStr = ArticleTools.formatDate(article.timestamp);

  container.innerHTML = `
    <h1 class="article-title">${ArticleTools.escapeHtml(article.title)}</h1>
    <div class="author">By ${ArticleTools.escapeHtml(article.author || '')}</div>
    <div class="date">Published on ${dateStr} | ${article.views ?? 0} views</div>
    ${tagsHtml ? `<div class="tag-pills">${tagsHtml}</div>` : ''}
    ${article.image ? `<img src="${ArticleTools.escapeHtml(article.image)}" alt="Image for ${ArticleTools.escapeHtml(article.title)}" loading="lazy">` : ''}
    <div class="article-body">${article.body || ''}</div>
    <div class="all-articles-cta" style="margin-top: 24px;">
      <a href="all-articles.html" class="btn-pill">View All Articles</a>
    </div>
  `;

  const authorSlug = article.author_slug || ArticleTools.slugifyName(article.author || '');

  const { data: authorRow } = await supabase
    .from('authors')
    .select('*')
    .eq('slug', authorSlug)
    .single();

  const author = authorRow || { name: article.author || 'Unknown', photo: '', bio: '' };
  const authorLink = `author.html?author=${encodeURIComponent(authorSlug)}`;
  const authorPhoto = author.photo || 'images/author-placeholder.png';

  const authorBlock = document.createElement('div');
  authorBlock.className = 'author-card';
  authorBlock.innerHTML = `
    <a href="${authorLink}"><img src="${ArticleTools.escapeHtml(authorPhoto)}" alt="${ArticleTools.escapeHtml(author.name)}"></a>
    <div><a class="name" href="${authorLink}">${ArticleTools.escapeHtml(author.name)}</a></div>
  `;
  container.appendChild(authorBlock);
})();
</script>
</body>
</html>
