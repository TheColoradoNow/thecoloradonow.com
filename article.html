 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .article-title {
      font-size: 2em;
      margin-bottom: 10px;
    }
    .fixed-home-bar {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 5px 6px 9px;
      background: rgba(255, 255, 255, 0.96);
    }
    .fixed-home-logo {
      display: block;
      padding: 0;
      background: transparent;
    }
    .fixed-home-logo img {
      display: block;
      width: 52px;
      height: 52px;
      margin: 0;
      object-fit: contain;
    }
    .fixed-section-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .fixed-section-nav a {
      color: #C8102E;
      font-family: Georgia, serif;
      font-size: 12px;
      font-weight: bold;
      line-height: 1;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .fixed-section-nav a:hover { color: #a30d24; }
    .article-byline {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      font-size: 0.9em;
      font-style: italic;
    }
    .article-byline a {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: inherit;
      text-decoration: none;
    }
    .article-byline a:hover {
      color: #B5281A;
      text-decoration: underline;
    }
    .article-byline img {
      width: 36px;
      height: 36px;
      margin: 0;
      border: 1px solid #ddd;
      border-radius: 50%;
      object-fit: cover;
    }
    .date {
      color: #666;
      font-size: 0.85em;
      margin-bottom: 20px;
    }
    .article-body {
      line-height: 1.6;
    }
    .article-hero-image,
    .article-body img {
      max-width: 100%;
      margin: 20px 0;
    }
    .article-hero-image {
      display: block;
      width: 100%;
      height: auto;
    }
    .article-video-section {
      width: 86%;
      margin: 0 auto;
    }
    .youtube-embed {
      aspect-ratio: 16 / 9;
      margin: 20px 0 28px;
      width: 100%;
    }
    .youtube-embed iframe {
      border: 0;
      display: block;
      height: 100%;
      width: 100%;
    }
    .tag-pills {
  margin: 8px 0 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-pill {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid #B5281A;   /* Colorado red */
  color: #B5281A;               /* Colorado red */
  border-radius: 9999px;        /* fully rounded pill */
  font-size: 0.85em;
  text-decoration: none;
  line-height: 1.2;
}
.tag-pill:hover {
  background: #B5281A;
  color: #fff;
}
    .article-footer-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      margin: 34px 0 40px;
    }
    .more-by-author {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #202C50;
      font-weight: bold;
      text-decoration: none;
    }
    .more-by-author:hover {
      color: #B5281A;
    }
    .more-by-author img {
      width: 52px;
      height: 52px;
      margin: 0;
      border: 1px solid #ddd;
      border-radius: 50%;
      object-fit: cover;
    }
    .article-all-articles-link {
      justify-self: center;
      color: #C8102E;
      font-size: 14px;
      font-weight: bold;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .article-all-articles-link:hover {
      color: #a30d24;
    }
    @media (max-width: 980px) {
      body { margin-top: 120px; }
      .fixed-home-bar {
        top: 0;
        left: 0;
        right: 0;
        height: 102px;
        box-sizing: border-box;
        padding: 6px 10px 8px;
        background: #fff;
        border-bottom: 1px solid #eee;
        align-items: flex-start;
        gap: 10px;
      }
      .fixed-home-logo {
        display: inline-block;
        padding: 0;
        background: transparent;
      }
      .fixed-home-logo img {
        width: 42px;
        height: 42px;
      }
      .fixed-section-nav {
        flex-direction: row;
        gap: 28px;
      }
      .fixed-section-nav a {
        font-size: 11px;
      }
    }
    @media (max-width: 560px) {
      .article-video-section { width: 92%; }
      .article-footer-actions { gap: 12px; }
      .more-by-author { font-size: 14px; }
      .more-by-author img {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="fixed-home-bar">
    <a class="fixed-home-logo" href="index.html" aria-label="The Colorado Now homepage">
      <img src="colorado-now-logo-N-2026.png" alt="">
    </a>
    <nav class="fixed-section-nav" aria-label="Section navigation">
      <a href="news.html">NEWS</a>
      <a href="community.html">COMMUNITY</a>
      <a href="opinion.html">OPINION</a>
    </nav>
  </div>
  <div id="articleContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="article-rendering.js"></script>

  <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const params = new URLSearchParams(window.location.search);
  const idParam = params.get('id');
  const id = Number(idParam);
  const container = document.getElementById('articleContainer');

  if (!idParam || Number.isNaN(id)) {
    container.innerHTML = '<p>Invalid article link.</p>';
    return;
  }

  const { data: article, error } = await supabase
    .from('articles')
    .select('id,title,author,author_slug,image,body,tags,timestamp,editors_pick')
    .eq('id', id)
    .single();

  if (error || !article) {
    container.innerHTML = '<p>Article not found.</p>';
    console.error(error);
    return;
  }

  const authorSlug = article.author_slug || ArticleTools.slugifyName(article.author || '');
  const { data: authorRow } = await supabase
    .from('authors')
    .select('slug,name,photo,bio')
    .eq('slug', authorSlug)
    .single();

  const author = authorRow || { name: article.author || 'Unknown', photo: '', bio: '' };
  const authorLink = `author.html?author=${encodeURIComponent(authorSlug)}`;
  const authorPhoto = author.photo || 'colorado-now-logo-N-2026.png';
  const authorName = author.name || article.author || 'Unknown';
  const tagsHtml = ArticleTools.makeTagPillsHtml(article);
  const dateStr = ArticleTools.formatDate(article.timestamp);

  function getYouTubeVideoId(value) {
    const text = String(value || '').trim();
    if (!text) return '';
    try {
      const url = new URL(text, window.location.href);
      const host = url.hostname.replace(/^www\./, '');
      const parts = url.pathname.split('/').filter(Boolean);
      if (host === 'youtu.be') return parts[0] || '';
      if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
        if (url.pathname === '/watch') return url.searchParams.get('v') || '';
        if ((parts[0] === 'embed' || parts[0] === 'shorts' || parts[0] === 'live') && parts[1]) return parts[1];
      }
    } catch (videoError) {
      return '';
    }
    return '';
  }

  function makeYouTubeEmbedHtml(videoId) {
    const safeId = String(videoId || '').replace(/[^A-Za-z0-9_-]/g, '');
    if (!safeId) return '';
    return `<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/${safeId}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
  }

  const bodyHolder = document.createElement('div');
  bodyHolder.innerHTML = article.body || '';
  bodyHolder.querySelectorAll('p').forEach((paragraph) => {
    if (paragraph.querySelector('.youtube-embed')) return;
    const link = paragraph.querySelector('a[href]');
    const candidate = link?.href || paragraph.textContent.trim();
    const videoId = getYouTubeVideoId(candidate);
    const onlyContainsVideoLink = link
      ? paragraph.textContent.trim() === link.textContent.trim()
      : /^https?:\/\/\S+$/i.test(paragraph.textContent.trim());
    if (videoId && onlyContainsVideoLink) paragraph.outerHTML = makeYouTubeEmbedHtml(videoId);
  });
  const videoHtml = Array.from(bodyHolder.querySelectorAll('.youtube-embed')).map((embed) => {
    const html = embed.outerHTML;
    embed.remove();
    return html;
  }).join('');

  container.innerHTML = `
    <h1 class="article-title">${ArticleTools.escapeHtml(article.title)}</h1>
    <div class="article-byline">
      <a href="${authorLink}">
        <img src="${ArticleTools.escapeHtml(authorPhoto)}" alt="${ArticleTools.escapeHtml(authorName)}">
        <span>By ${ArticleTools.escapeHtml(authorName)}</span>
      </a>
    </div>
    <div class="date">Published on ${dateStr}</div>
    ${tagsHtml ? `<div class="tag-pills">${tagsHtml}</div>` : ''}
    ${article.image ? `<img class="article-hero-image" src="${ArticleTools.escapeHtml(article.image)}" alt="Image for ${ArticleTools.escapeHtml(article.title)}" loading="lazy">` : ''}
    ${videoHtml ? `<div class="article-video-section">${videoHtml}</div>` : ''}
    <div class="article-body">${bodyHolder.innerHTML}</div>
    <div class="article-footer-actions">
      <a class="more-by-author" href="${authorLink}">
        <img src="${ArticleTools.escapeHtml(authorPhoto)}" alt="">
        <span>More by ${ArticleTools.escapeHtml(authorName)}</span>
      </a>
      <a href="all-articles.html" class="article-all-articles-link">View All Articles</a>
    </div>
  `;

  try {
    await supabase.rpc('increment_article_view', { p_id: id });
  } catch (e) {
    console.warn('View increment failed:', e);
  }
})();
</script>
</body>
</html>
