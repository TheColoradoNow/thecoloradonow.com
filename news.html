<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News - The Colorado Now</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 36px auto 50px;
      padding: 0 20px;
    }

    .category-box {
      position: relative;
      height: 200px;
      background-color: #ccc;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .category-box span {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 5px 10px;
      font-weight: bold;
      font-size: 20px;
      font-family: Georgia, serif;
      border-radius: 4px;
    }

    nav.main-nav a {
      cursor: pointer;
    }

    .news-section-header .main-nav-left {
      justify-content: center;
      width: 100%;
    }

    .news-section-header .section-home-link {
      transform: translateX(-58px);
    }

    @media (max-width: 760px) {
      .news-section-header .section-home-link {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="top-utility-bar">
    <div class="top-utility-inner">
      <a class="top-utility-link" href="subscribe.html">Subscribe</a>
      <a class="top-utility-link" href="mailto:tips@thecoloradonow.com?subject=Submit%20a%20Tip">Submit a Tip</a>
      <nav class="top-social-links" aria-label="Social media">
        <a class="top-social-link" href="https://www.youtube.com/@The-Colorado-Now" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <img src="icons/youtube.svg" alt="">
        </a>
        <a class="top-social-link" href="https://www.instagram.com/coloradonow_/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <img src="icons/instagram.svg" alt="">
        </a>
        <a class="top-social-link" href="https://www.tiktok.com/@coloradonow_" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <img src="icons/tiktok.svg" alt="">
        </a>
        <span class="top-social-link is-disabled" aria-label="Facebook coming soon" title="Facebook coming soon">
          <img src="icons/facebook.svg" alt="">
        </span>
        <a class="top-social-link" href="https://x.com/TheColoradoNow" target="_blank" rel="noopener noreferrer" aria-label="X">
          <img src="icons/x.svg" alt="">
        </a>
        <a class="top-social-link" href="https://bsky.app/profile/thecoloradonow.bsky.social" target="_blank" rel="noopener noreferrer" aria-label="Bluesky">
          <img src="icons/bluesky.svg" alt="">
        </a>
        <a class="top-social-link" href="https://substack.com/@thecoloradonow" target="_blank" rel="noopener noreferrer" aria-label="Substack">
          <img src="icons/substack.svg" alt="">
        </a>
      </nav>
    </div>
  </div>
  <header class="main-header news-section-header">
    <div class="logo-social-container">
      <nav class="main-nav main-nav-left" aria-label="Primary navigation">
        <a class="section-home-link" href="index.html" aria-label="The Colorado Now home">
          <img src="colorado-now-logo-N-2026.png" alt="" class="section-home-logo">
        </a>
        <a href="community.html">COMMUNITY</a>
        <a href="opinion.html">OPINION</a>
      </nav>
      <div class="logo-container section-title-container">
        <h1 class="section-masthead-title">NEWS</h1>
      </div>
      <nav class="main-nav main-nav-right" aria-label="About and search">
        <a href="about.html">ABOUT US</a>
        <a class="search-nav-link" href="search.html" aria-label="Search articles" title="Search articles">
          <span class="search-icon" aria-hidden="true"></span>
        </a>
      </nav>
    </div>
  </header>

  <main class="news-grid-container">
    <section class="news-latest-section" aria-labelledby="news-latest-heading">
      <h2 id="news-latest-heading" class="news-section-heading">Latest News</h2>
      <div id="news-latest-grid" class="news-latest-grid"></div>
    </section>

    <section class="category-grid" aria-label="News categories">
      <a href="tag.html?tag=happening-now">
        <div class="category-box" style="background-image: url('images/happening-now.jpg');">
          <span>Happening Now</span>
        </div>
      </a>

      <a href="tag.html?tag=politics">
        <div class="category-box" style="background-image: url('images/politics.jpg');">
          <span>Politics</span>
        </div>
      </a>

      <a href="tag.html?tag=environment">
        <div class="category-box" style="background-image: url('images/environment.jpg');">
          <span>Environment</span>
        </div>
      </a>

      <a href="tag.html?tag=transportation">
        <div class="category-box" style="background-image: url('images/transportation.jpg');">
          <span>Transportation</span>
        </div>
      </a>

      <a href="tag.html?tag=education">
        <div class="category-box" style="background-image: url('images/education.jpg');">
          <span>Education</span>
        </div>
      </a>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="article-rendering.js"></script>

<script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const newsTags = ['happening-now','politics','environment','transportation','education'];
  const grid = document.getElementById('news-latest-grid');

  const { data: rows, error } = await supabase
    .from('articles')
    .select('*')
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('Error loading articles:', error);
    grid.innerHTML = '<p>Could not load articles.</p>';
    return;
  }

  const filtered = (rows || []).filter((article) => ArticleTools.articleMatchesTags(article, newsTags));
  const toShow = filtered.slice(0, 6);

  if (!toShow.length) {
    grid.innerHTML = '<p>No recent News articles yet.</p>';
    return;
  }

  grid.innerHTML = '';
  toShow.forEach((article) => grid.appendChild(ArticleTools.createHomepageCard(article)));
})();
</script>
</body>
</html>
