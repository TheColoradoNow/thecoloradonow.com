<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News - The Colorado Now</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .category-box {
      position: relative;
      height: 200px;
      background-color: #ccc;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .category-box span {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 5px 10px;
      font-weight: bold;
      font-size: 20px;
      font-family: Georgia, serif;
      border-radius: 4px;
    }

    nav.main-nav a {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="logo-social-container">
      <div class="logo-container">
        <img src="logo.png" alt="The Colorado Now Logo" class="logo" />
      </div>
    </div>
    <nav class="main-nav">
      <a href="index.html">HOME</a>
      <a href="#">NEWS</a>
      <a href="community.html">COMMUNITY</a>
      <a href="opinion.html">OPINION</a>
      <a href="#">YOUTUBE</a>
      <a href="#">ABOUT US</a>
    </nav>
  </header>

  <main class="news-grid-container">
    <h1 class="news-heading">News</h1>
    <section class="category-grid">
      <a href="tag.html?tag=happening-now">
        <div class="category-box" style="background-image: url('images/happening-now.jpg');">
          <span>Happening Now</span>
        </div>
      </a>

      <a href="tag.html?tag=politics">
        <div class="category-box" style="background-image: url('images/politics.jpg');">
          <span>Politics</span>
        </div>
      </a>

      <a href="tag.html?tag=environment">
        <div class="category-box" style="background-image: url('images/environment.jpg');">
          <span>Environment</span>
        </div>
      </a>

      <a href="tag.html?tag=transportation">
        <div class="category-box" style="background-image: url('images/transportation.jpg');">
          <span>Transportation</span>
        </div>
      </a>

      <a href="tag.html?tag=education">
        <div class="category-box" style="background-image: url('images/education.jpg');">
          <span>Education</span>
        </div>
      </a>
    </section>
    <section class="articles" style="margin-top: 30px;">
  <h2 class="news-heading" style="text-align:left;">Latest in News</h2>
  <div id="news-latest-list" class="article-list"></div>
</section>
  </main>

  <div class="all-articles-cta">
    <a href="all-articles.html" class="btn-pill">View All Articles</a>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="article-rendering.js"></script>

<script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const newsTags = ['happening-now','politics','environment','transportation','education'];
  const list = document.getElementById('news-latest-list');

  const { data: rows, error } = await supabase
    .from('articles')
    .select('*')
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('Error loading articles:', error);
    list.innerHTML = '<p>Could not load articles.</p>';
    return;
  }

  const filtered = (rows || []).filter((article) => ArticleTools.articleMatchesTags(article, newsTags));
  const toShow = filtered.slice(0, 8);

  list.innerHTML = '';
  toShow.forEach((article) => list.appendChild(ArticleTools.createHomepageCard(article)));
})();
</script>
</body>
</html>
