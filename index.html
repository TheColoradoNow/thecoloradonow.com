    <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const editorsList = document.getElementById('editors-picks-list');
  const latestList = document.getElementById('latest-articles-list');

  const { data: rows, error } = await supabase
    .from('articles')
    .select('id,title,author,image,tags,timestamp,editors_pick')
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('Error loading articles:', error);
    editorsList.innerHTML = '<p>Could not load articles.</p>';
    latestList.innerHTML = '<p>Could not load articles.</p>';
    return;
  }

  const articles = rows || [];
  const isEditorsPick = (article) => article.editors_pick === true || article.editorsPick === true;
  const editorsPicks = articles.filter(isEditorsPick).slice(0, 2);
  const pickIds = new Set(editorsPicks.map((article) => article.id));
  const latestArticles = articles.filter((article) => !pickIds.has(article.id)).slice(0, 2);

  editorsList.innerHTML = '';
  latestList.innerHTML = '';

  if (editorsPicks.length === 0) {
    editorsList.innerHTML = '<p>No Editor\'s Picks yet.</p>';
  } else {
    editorsPicks.forEach((article) => editorsList.appendChild(ArticleTools.createHomepageCard(article)));
  }

  if (latestArticles.length === 0) {
    latestList.innerHTML = '<p>No recent articles yet.</p>';
  } else {
    latestArticles.forEach((article) => latestList.appendChild(ArticleTools.createHomepageCard(article)));
  }
})();
</script>
