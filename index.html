                </a>
                <a class="top-social-link" href="https://www.tiktok.com/@coloradonow_" target="_blank" rel="noopener noreferrer" aria-label="TikTok">

                <a class="top-social-link" href="https://x.com/TheColoradoNow" target="_blank" rel="noopener noreferrer" aria-label="X">
                    <img src="icons/x.svg" alt="">
                </a>

    </div>
    <header class="main-header">
        <div class="logo-social-container">
            <nav class="main-nav main-nav-left" aria-label="Primary navigation">
                <a href="news.html">NEWS</a>
                <a href="community.html">COMMUNITY</a>

            </nav>

                <a class="logo-link" href="index.html">

        </div>
    </header>

   <main class="articles homepage-sections-wrapper" role="main">
  <section id="latest-articles" class="homepage-section">
  <h2>The Latest</h2>
  <div class="article-list" id="latest-articles-list"></div>
  <div class="section-articles-cta">
    <a href="all-articles.html" class="section-articles-link">View All Articles</a>
  </div>
</section>

<section id="editors-picks" class="homepage-section">
  <h2>Editor's Picks</h2>
  <div class="article-list" id="editors-picks-list"></div>
  <div class="section-articles-cta">
    <a href="all-articles.html" class="section-articles-link">View All Articles</a>
  </div>
</section>
</main>
    <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const editorsList = document.getElementById('editors-picks-list');
  const latestList = document.getElementById('latest-articles-list');

  const { data: rows, error } = await supabase
    .from('articles')
    .select('id,title,author,image,timestamp,editors_pick,editorsPick')
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('Error loading articles:', error);
    editorsList.innerHTML = '<p>Could not load articles.</p>';
    latestList.innerHTML = '<p>Could not load articles.</p>';
    return;
  }

  const articles = rows || [];
  const isEditorsPick = (article) => article.editors_pick === true || article.editorsPick === true;
  const editorsPicks = articles.filter(isEditorsPick).slice(0, 2);
  const pickIds = new Set(editorsPicks.map((article) => article.id));
  const latestArticles = articles.filter((article) => !pickIds.has(article.id)).slice(0, 2);

  editorsList.innerHTML = '';
  latestList.innerHTML = '';

  if (editorsPicks.length === 0) {
    editorsList.innerHTML = '<p>No Editor\'s Picks yet.</p>';
  } else {
    editorsPicks.forEach((article) => editorsList.appendChild(ArticleTools.createHomepageCard(article)));
  }

  if (latestArticles.length === 0) {
    latestList.innerHTML = '<p>No recent articles yet.</p>';
  } else {
    latestArticles.forEach((article) => latestList.appendChild(ArticleTools.createHomepageCard(article)));
  }
})();
</script>
</body>
</html>
