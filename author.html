<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Author</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .author-header {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .author-header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ddd;
    }
    .author-name {
      font-size: 1.8em;
      margin: 0 0 6px 0;
    }
    .author-bio { color: #444; }
    .article {
      border-bottom: 1px solid #eee;
      padding: 16px 0;
    }
    .article h2 {
      margin: 0 0 6px 0;
      font-size: 1.25em;
    }
    .meta {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    .article h2 a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .article h2 a:hover {
      color: #B5281A;
    }
    .tag-pills {
      margin: 6px 0 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-pill {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid #B5281A;
      color: #B5281A;
      border-radius: 9999px;
      font-size: 0.85em;
      text-decoration: none;
      line-height: 1.2;
    }
    .tag-pill:hover { background: #B5281A; color: #fff; }
    .author-articles-cta {
      margin: 30px 0 50px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 class="author-name" id="pageTitle" style="display:none;"></h1>

  <div class="author-header" id="authorHeader" style="display:none;">
    <img id="authorPhoto" alt="">
    <div>
      <div class="author-name" id="authorName"></div>
      <div class="author-bio" id="authorBio"></div>
    </div>
  </div>

  <div id="authorArticles"></div>

  <div class="author-articles-cta">
    <a href="all-articles.html" class="section-articles-link">View All Articles</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="article-rendering.js"></script>

  <script>
  (async function () {
    const supabase = window.TheColoradoNow.supabase;
    const ArticleTools = window.TheColoradoNow.articles;
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('author') || '';
    const authorSlug = decodeURIComponent(raw).toLowerCase();

    const { data: authorRow, error: authorError } = await supabase
      .from('authors')
      .select('slug,name,photo,bio')
      .eq('slug', authorSlug)
      .single();

    if (authorError) {
      console.error('Error loading author:', authorError);
    }

    const author = authorRow || null;

    const { data: rows, error: articlesError } = await supabase
      .from('articles')
      .select('id,title,author,author_slug,image,body,tags,timestamp,editors_pick')
      .order('timestamp', { ascending: false });

    if (articlesError) {
      console.error('Error loading articles:', articlesError);
    }

    const articles = rows || [];

    const headerEl = document.getElementById('authorHeader');
    const photoEl = document.getElementById('authorPhoto');
    const nameEl = document.getElementById('authorName');
    const bioEl = document.getElementById('authorBio');
    const pageTitle = document.getElementById('pageTitle');
    const listEl = document.getElementById('authorArticles');

    if (!author && !articles.length) {
      document.body.insertAdjacentHTML('afterbegin', '<p>No author or articles found.</p>');
      return;
    }

    const inferredName = (() => {
      const any = articles.find((article) => {
        return (article.author_slug || ArticleTools.slugifyName(article.author || '')) === authorSlug;
      });
      return any?.author || ArticleTools.formatTagLabel(authorSlug);
    })();

    const displayName = author?.name || inferredName;
    const displayPhoto = author?.photo || 'colorado-now-logo-N-2026.png';
    const displayBio = author?.bio || '';

    pageTitle.style.display = 'block';
    pageTitle.textContent = displayName;

    headerEl.style.display = 'grid';
    photoEl.src = displayPhoto;
    photoEl.alt = displayName;
    nameEl.textContent = displayName;
    bioEl.textContent = displayBio;

    const filtered = articles.filter((article) => {
      const slug = article.author_slug || ArticleTools.slugifyName(article.author || '');
      return slug === authorSlug;
    }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    if (!filtered.length) {
      listEl.innerHTML = '<p>No articles by this author yet.</p>';
      return;
    }

    filtered.forEach((article) => {
      listEl.appendChild(ArticleTools.createArticleListItem(article, {
        showAuthor: false,
        publishedPrefix: 'Published'
      }));
    });
  })();
  </script>
</body>
</html>
