<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opinion Articles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <!-- Include your site nav here -->
  </header>

  <main>
    <h1>Opinion</h1>
    <section id="opinion-articles" class="article-list"></section>
  </main>

  <div class="all-articles-cta">
    <a href="all-articles.html" class="btn-pill">View All Articles</a>
  </div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="article-rendering.js"></script>

  <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const container = document.getElementById('opinion-articles');

  const { data: rows, error } = await supabase
    .from('articles')
    .select('id,title,author,image,body,tags,tag,timestamp')
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('Error loading articles:', error);
    container.innerHTML = '<p>Could not load articles.</p>';
    return;
  }

  const filtered = (rows || []).filter((article) => ArticleTools.articleMatchesTags(article, ['opinion']));

  if (!filtered.length) {
    container.innerHTML = '<p>No opinion articles found.</p>';
    return;
  }

  container.innerHTML = '';
  filtered.forEach((article) => {
    container.appendChild(ArticleTools.createArticleListItem(article, {
      className: 'article-preview',
      readMore: true
    }));
  });
})();
</script>
</body>
</html>
