<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Articles by Tag</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-transform: capitalize;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }
    .article {
      border-bottom: 1px solid #ccc;
      margin-bottom: 30px;
      padding-bottom: 20px;
    }
    .article img {
      max-width: 100%;
      height: auto;
      margin-top: 10px;
    }
    .author {
      font-style: italic;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .article h2 a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s ease;
}
.article h2 a:hover {
  color: #B5281A; /* Colorado red */
}

.tag-pills {
  margin: 6px 0 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-pill {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid #B5281A;
  color: #B5281A;
  border-radius: 9999px;
  font-size: 0.85em;
  text-decoration: none;
  line-height: 1.2;
}
.tag-pill:hover {
  background: #B5281A;
  color: #fff;
}
  .article p { 
    word-break: break-word; 
  }
  </style>
</head>
<body>
  <h1 id="tagTitle">Loading...</h1>
  <div id="articlesContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="article-rendering.js"></script>

  <script>
(async function () {
  const supabase = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const params = new URLSearchParams(window.location.search);
  const rawTag = params.get('tag') || '';
  const tag = decodeURIComponent(rawTag).toLowerCase().trim();

  const container = document.getElementById('articlesContainer');
  const tagTitle = document.getElementById('tagTitle');
  tagTitle.textContent = ArticleTools.formatTagLabel(tag);

  const { data: rows, error } = await supabase
    .from('articles')
    .select('*')
    .order('timestamp', { ascending: false });

  if (error) {
    console.error('Error loading articles:', error);
    container.innerHTML = '<p>Could not load articles.</p>';
    return;
  }

  const filtered = (rows || []).filter((article) => ArticleTools.articleMatchesTags(article, [tag]));

  if (!filtered.length) {
    container.innerHTML = '<p>No articles found for this topic yet.</p>';
    return;
  }

  container.innerHTML = '';
  filtered.forEach((article) => {
    container.appendChild(ArticleTools.createArticleListItem(article, {
      metaClass: 'author',
      readMore: true
    }));
  });
})();
</script>
</body>
</html>
