<!DOCTYPE html>
<html lang="en">
<head>
  <!-- deployment refresh: 2026-07-06 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Publish Article</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      font-size: 16px;
    }
    .admin-nav {
      text-align: center;
      margin-bottom: 20px;
    }
    .admin-nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #B5281A; /* brand red */
    }
    #sendLink {
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }
    #sendLink.is-sending {
      background: #6b7280;
      color: #fff;
      cursor: wait;
    }
    #sendLink.is-sent {
      background: #0f8a42;
      color: #fff;
    }
    #sendLink.is-error {
      background: #B5281A;
      color: #fff;
    }
    #sendLink:disabled {
      opacity: 0.8;
    }
    .auth-status-error {
      color: #B5281A !important;
      font-weight: bold;
    }
    .auth-status-success {
      color: #0f8a42 !important;
      font-weight: bold;
    }

    .tag-groups {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 10px;
    }
    .tag-group {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
    }
    .tag-group h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    .checkbox-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px 14px;
    }
    .checkbox-list label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-weight: normal;
    }
    .inline-hint {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
      display: block;
    }
    button[type="submit"] {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="admin-nav">
    <a href="admin.html">New Article</a>
  </div>

  <h1>Publish New Article</h1>
  
<div id="auth-box" style="margin:16px 0; border:1px solid #ddd; padding:12px; border-radius:6px;">
  <p><strong>Sign in to publish</strong></p>
  <input type="email" id="loginEmail" placeholder="you@example.com" style="max-width:320px;">
  <button type="button" id="sendLink">Send magic sign-in link</button>
  <p id="authStatus" style="font-size:13px;color:#666;margin-top:8px;"></p>
</div>
  
<div id="admin-ui" style="display:none;">
  <form id="articleForm">
    <label for="title">Article Title:</label>
    <input type="text" id="title" required>

    <label for="author">Author:</label>
    <input type="text" id="author" required>
    <label for="authorPhoto">Author Photo URL (optional):</label>
<input type="url" id="authorPhoto" placeholder="https://...">

<label for="authorBio">Author Bio (optional):</label>
<textarea id="authorBio" rows="4" placeholder="Short bio shown on the author page."></textarea>

    <label for="image">Image URL:</label>
    <input type="url" id="image" placeholder="https://...">

    <label for="body">Article Content:</label>
    <textarea id="body" rows="10" required></textarea>

    <label for="date">Publication Date (optional):</label>
    <input type="date" id="date">

    <label>Tags (choose one or more):</label>
    <div class="tag-groups">
      <div class="tag-group">
        <h3>News</h3>
        <div class="checkbox-list">
          <label><input type="checkbox" name="tags" value="happening-now"> Happening Now</label>
          <label><input type="checkbox" name="tags" value="politics"> Politics</label>
          <label><input type="checkbox" name="tags" value="environment"> Environment</label>
          <label><input type="checkbox" name="tags" value="transportation"> Transportation</label>
          <label><input type="checkbox" name="tags" value="education"> Education</label>
        </div>
      </div>

      <div class="tag-group">
        <h3>Community</h3>
        <div class="checkbox-list">
          <label><input type="checkbox" name="tags" value="people"> People</label>
          <label><input type="checkbox" name="tags" value="events"> Events</label>
        </div>
      </div>

      <div class="tag-group">
        <h3>Opinion</h3>
        <div class="checkbox-list">
          <label><input type="checkbox" name="tags" value="opinion"> Opinion</label>
        </div>
        <span class="inline-hint">You can combine Opinion with other tags if appropriate.</span>
      </div>
    </div>

    <label>
      <input type="checkbox" id="editorsPick">
      Feature in Editor's Picks
    </label>

    <button type="submit">Publish Article</button>
  </form>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="article-rendering.js"></script>

 <script>
  const supabaseClient = window.TheColoradoNow.supabase;
  const ArticleTools = window.TheColoradoNow.articles;
  const allowedEditorEmails = new Set([
    'julianhanes5@gmail.com',
    'julian.hanes@thecoloradonow.com'
  ]);
  const sendLinkButton = document.getElementById('sendLink');
  const authStatus = document.getElementById('authStatus');

  function normalizeEmail(email) {
    return (email || '').trim().toLowerCase();
  }

  function isAllowedEditor(email) {
    return allowedEditorEmails.has(normalizeEmail(email));
  }

  function setAuthStatus(message, type) {
    authStatus.textContent = message;
    authStatus.classList.toggle('auth-status-error', type === 'error');
    authStatus.classList.toggle('auth-status-success', type === 'success');
  }

  function setSendButtonState(state, label) {
    sendLinkButton.classList.remove('is-sending', 'is-sent', 'is-error');
    if (state) sendLinkButton.classList.add(state);
    sendLinkButton.textContent = label;
    sendLinkButton.disabled = state === 'is-sending';
  }

  async function refreshAuthUI() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const signedIn = !!session;
    const signedInAsAllowedEditor = signedIn && isAllowedEditor(session.user?.email);

    if (signedIn && !signedInAsAllowedEditor) {
      await supabaseClient.auth.signOut();
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('admin-ui').style.display = 'none';
      setAuthStatus('This email is not approved to publish articles.', 'error');
      return;
    }

    document.getElementById('auth-box').style.display = signedInAsAllowedEditor ? 'none' : 'block';
    document.getElementById('admin-ui').style.display = signedInAsAllowedEditor ? 'block' : 'none';
    if (!signedInAsAllowedEditor && !authStatus.textContent) {
      setAuthStatus('Not signed in.', '');
    }
  }

  sendLinkButton.addEventListener('click', async () => {
    const email = normalizeEmail(document.getElementById('loginEmail').value);

    if (!email) {
      setAuthStatus('Enter your email.', 'error');
      setSendButtonState('is-error', 'Email required');
      setTimeout(() => setSendButtonState('', 'Send magic sign-in link'), 1800);
      return;
    }

    if (!isAllowedEditor(email)) {
      setAuthStatus('This email is not approved to publish articles.', 'error');
      setSendButtonState('is-error', 'Not approved');
      setTimeout(() => setSendButtonState('', 'Send magic sign-in link'), 2200);
      return;
    }

    setAuthStatus('Sending sign-in link...', '');
    setSendButtonState('is-sending', 'Sending...');

    const { error } = await supabaseClient.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });

    if (error) {
      setAuthStatus('Error sending link: ' + error.message, 'error');
      setSendButtonState('is-error', 'Could not send link');
      setTimeout(() => setSendButtonState('', 'Send magic sign-in link'), 2500);
    } else {
      setAuthStatus('Link sent. Check your email, then return to this page.', 'success');
      setSendButtonState('is-sent', 'Link sent - check email');
      setTimeout(() => setSendButtonState('', 'Send another link'), 8000);
    }
  });

  supabaseClient.auth.onAuthStateChange((_event, _session) => {
    refreshAuthUI();
  });

  refreshAuthUI();

  document.getElementById('articleForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session || !isAllowedEditor(session.user?.email)) {
      alert('You are not approved to publish articles.');
      await supabaseClient.auth.signOut();
      refreshAuthUI();
      return;
    }

    const tagChecks = Array.from(document.querySelectorAll('input[name="tags"]:checked'));
    const selectedTags = tagChecks.map(cb => cb.value);
    if (selectedTags.length === 0) {
      alert('Please select at least one tag.');
      return;
    }

    const title = document.getElementById('title').value.trim();
    const authorName = document.getElementById('author').value.trim();
    const authorPhoto = document.getElementById('authorPhoto')?.value.trim() || '';
    const authorBio = document.getElementById('authorBio')?.value.trim() || '';
    const image = document.getElementById('image').value.trim();
    const body = document.getElementById('body').value.trim();
    const customDate = document.getElementById('date').value;
    const editorsPick = document.getElementById('editorsPick').checked;

    if (!title || !authorName || !body) {
      alert('Title, Author, and Body are required.');
      return;
    }

    const authorSlug = ArticleTools.slugifyName(authorName);
    const id = Date.now();

    {
      const { error: authErr } = await supabaseClient
        .from('authors')
        .upsert({
          slug: authorSlug,
          name: authorName,
          photo: authorPhoto || null,
          bio: authorBio || null
        });
      if (authErr) {
        console.error(authErr);
        alert('Failed to save author: ' + authErr.message);
        return;
      }
    }

    {
      const { error: artErr } = await supabaseClient
        .from('articles')
        .insert({
          id,
          title,
          author: authorName,
          author_slug: authorSlug,
          image: image || null,
          body,
          tags: selectedTags,
          timestamp: customDate ? new Date(customDate).toISOString() : new Date().toISOString(),
          views: 0,
          editors_pick: editorsPick
        });

      if (artErr) {
        console.error(artErr);
        alert('Failed to publish article: ' + artErr.message);
        return;
      }
    }

    alert('Article published!');
    this.reset();
  });
</script>
</body>
</html>
